name: Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  HEXO_REPO: Edge-coordinates/hexo_Science-Blog
  THEME_REPO: jerryc127/hexo-theme-butterfly
  THEME_REF: "5.2.2"
  PAGES_PROJECT: rezedge-blog

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --immutable

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Front matter check
        run: task fm:check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Hexo site
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HEXO_REPO }}
          path: hexo
          token: ${{ secrets.HEXO_REPO_TOKEN || github.token }}

      - name: Checkout posts
        uses: actions/checkout@v5
        with:
          path: hexo/source/_posts/Science-Blog

      - name: Checkout Butterfly theme
        uses: actions/checkout@v5
        with:
          repository: ${{ env.THEME_REPO }}
          ref: ${{ env.THEME_REF }}
          path: hexo/themes/butterfly

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: hexo/yarn.lock

      - name: Install Hexo deps
        working-directory: hexo
        run: yarn install --immutable

      - name: Build
        working-directory: hexo
        run: yarn hexo generate

      - name: Ensure Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx --yes wrangler@4 pages project list --json | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          projects = data if isinstance(data, list) else data.get("result", data.get("projects", []))
          names = {p.get("name") for p in projects if isinstance(p, dict)}
          sys.exit(0 if os.environ["PAGES_PROJECT"] in names else 1)
          '; then
            echo "Pages project ${PAGES_PROJECT} already exists"
          else
            npx --yes wrangler@4 pages project create "${PAGES_PROJECT}" --production-branch=master
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Yarn 4 treats `yarn wrangler pages deploy --project-name=...` as Yarn
          # flags and exits 1. Force npm so wrangler receives the real CLI args.
          packageManager: npm
          command: pages deploy hexo/public --project-name=${{ env.PAGES_PROJECT }} --commit-dirty=true --branch ${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deployment URL
        if: always() && steps.deploy.outputs.deployment-url
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "deployment: $DEPLOYMENT_URL"
          echo "alias: $ALIAS_URL"
